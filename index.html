<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #070b10;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Share Tech Mono', monospace;
    }
    canvas {
      display: block;
      border: 1px solid #274252;
      box-shadow:
        0 0 0 1px #050a0f,
        0 0 22px rgba(89, 216, 255, 0.10),
        inset 0 0 20px rgba(89, 216, 255, 0.03);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(89, 216, 255, 0.025) 0px,
        rgba(255, 79, 216, 0.025) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: screen;
      z-index: 10;
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js?v=20260929-03"></script>
  <script src="src/config/GameConfig.js?v=20260929-03"></script>
  <script src="src/systems/GameState.js?v=20260929-03"></script>
  <script src="src/systems/LoopManager.js?v=20260929-03"></script>
  <script src="src/systems/UIManager.js?v=20260929-03"></script>
  <script src="src/systems/AudioManager.js?v=20260929-03"></script>
  <script src="src/systems/AnimationManager.js?v=20260929-03"></script>
  <script src="src/systems/PuzzleManager.js?v=20260929-03"></script>
  <script src="src/systems/DialogManager.js?v=20260929-03"></script>
  <script src="src/systems/FinalManager.js?v=20260929-03"></script>
  <script src="src/objects/InteractiveObject.js?v=20260929-03"></script>
  <script src="src/objects/Terminal.js?v=20260929-03"></script>
  <script src="src/objects/Player.js?v=20260929-03"></script>
  <script src="src/scenes/BootScene.js?v=20260929-03"></script>
  <script src="src/scenes/MenuScene.js?v=20260929-03"></script>
  <script src="src/scenes/GameScene.js?v=20260929-03"></script>
  <script src="src/scenes/ResetScene.js?v=20260929-03"></script>
  <script src="src/scenes/EndScene.js?v=20260929-03"></script>
  <script src="src/config/PhaserConfig.js?v=20260929-03"></script>
</body>
</html>
